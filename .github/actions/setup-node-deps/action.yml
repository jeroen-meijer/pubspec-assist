name: Setup Node dependencies
description: Node 22, restore npm/node_modules/ESLint caches, then npm ci.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Restore Node dependency cache
      uses: actions/cache@v4
      id: node-deps-cache
      with:
        path: |
          ~/.npm
          node_modules
          .eslintcache
        key: node-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-deps-${{ runner.os }}-

    - name: Install dependencies
      if: steps.node-deps-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - name: Ensure node_modules after cache hit
      if: steps.node-deps-cache.outputs.cache-hit == 'true'
      run: test -d node_modules/mocha && test -d node_modules/esbuild || npm ci
      shell: bash
