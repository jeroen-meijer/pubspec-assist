name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Test
        run: npm test

      - name: Verify VSIX bundles runtime dependencies
        run: |
          npm run package
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const vsix = fs.readdirSync(".").find((f) => f.endsWith(".vsix"));
            if (!vsix) {
              console.error("no VSIX produced");
              process.exit(1);
            }
            const listing = execSync("unzip -Z -1 " + JSON.stringify(vsix), {
              encoding: "utf8",
            });
            if (!listing.includes("extension/out/extension.js")) {
              console.error("VSIX missing extension/out/extension.js");
              process.exit(1);
            }
            if (
              listing.includes("node_modules/yaml") ||
              listing.includes("node_modules/fuse.js")
            ) {
              console.error("VSIX still ships unbundled yaml/fuse.js");
              process.exit(1);
            }
            console.log("ok", vsix);
          '
